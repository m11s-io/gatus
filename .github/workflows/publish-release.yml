name: publish-release
on:
  release:
    types: [published]
jobs:
  publish-release:
    name: publish-release
    permissions:
      contents: read
    uses: m11s-io/.github/.github/workflows/container-image.yml@main
    with:
      source-ref: ${{ github.sha }}
      repository: m11s/gatus
      tags: m11s/gatus:${{ github.event.release.tag_name }},m11s/gatus:stable,m11s/gatus:latest
      platforms: linux/amd64,linux/arm/v7,linux/arm64
      node-version: "24"
      push: true
      timeout-minutes: 240
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
