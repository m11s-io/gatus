name: publish-experimental
on: [workflow_dispatch]
jobs:
  publish-experimental:
    permissions:
      contents: read
    uses: m11s-io/.github/.github/workflows/container-image.yml@main
    with:
      source-ref: ${{ github.sha }}
      repository: m11s/gatus
      tags: m11s/gatus:experimental
      platforms: linux/amd64
      push: true
      timeout-minutes: 60
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
