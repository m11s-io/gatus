name: publish-latest
on:
  workflow_run:
    workflows: [test]
    branches: [master]
    types: [completed]
concurrency:
  group: ${{ github.event.workflow_run.head_repository.full_name }}::${{ github.event.workflow_run.head_branch }}::${{ github.workflow }}
  cancel-in-progress: true
jobs:
  publish-latest:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    permissions:
      contents: read
    uses: m11s-io/.github/.github/workflows/container-image.yml@main
    with:
      source-ref: ${{ github.event.workflow_run.head_sha }}
      repository: m11s/gatus
      tags: m11s/gatus:latest
      platforms: linux/amd64,linux/arm/v7,linux/arm64
      node-version: "24"
      push: true
      timeout-minutes: 240
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
